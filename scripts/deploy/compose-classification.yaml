services:
  classifier-model-init:
    image: damgox2-ai:ubuntu26.04-java25-20261109
    build:
      context: .
      target: ai
    entrypoint: ['/opt/classification/model-init.sh']
    volumes: [classification_models:/models]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 192m
    cpus: 0.5
    restart: 'no'
  classifier:
    image: damgox2-ai:ubuntu26.04-java25-20261109
    build:
      context: .
      target: ai
    environment:
      DAMGOX2_AI_KIND: classification
      CLASSIFICATION_THREADS: ${CLASSIFICATION_THREADS:-2}
    volumes: [classification_models:/models:ro]
    secrets: [classification_key]
    networks: [classification]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: ${CLASSIFICATION_MEMORY:-4g}
    cpus: ${CLASSIFICATION_CPUS:-2}
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      classifier-model-init: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD','curl','--fail','--silent','--max-time','3','http://127.0.0.1:9931/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
  worker:
    environment:
      DAMGOX2_CLASSIFICATION_URL: http://classifier:9931/v1/chat/completions
      DAMGOX2_CLASSIFICATION_KEY_FILE: /run/secrets/classification_key
    secrets: [classification_key]
    networks: [backend,classification]
secrets:
  classification_key:
    file: ${CLASSIFICATION_KEY_FILE:-./.local/classification/api.key}
networks:
  classification:
    internal: true
volumes:
  classification_models:
