services:
  web:
    healthcheck:
      test: ['CMD-SHELL','curl -fsS -H "Host: $${PUBLIC_BASE_URL#*://}" http://localhost:8080/internal/live >/dev/null']
  proxy:
    image: damgox2-proxy-public:2.11.7
    build:
      target: public-proxy
    environment:
      DAMGOX2_PUBLIC_HOST: ${DAMGOX2_PUBLIC_HOST:?Set approved public IP or domain}
    ports: !override
      - '${DAMGOX2_PUBLIC_HOST}:80:8081'
      - '${DAMGOX2_PUBLIC_HOST}:443:8443'
      - '127.0.0.1:8080:8080'
    volumes: !override [public_caddy_data:/data,public_caddy_config:/config]
volumes:
  public_caddy_data:
  public_caddy_config:
