{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {namespace: {{ .Release.Namespace | quote }}, name: moapan}
spec:
  ingressClassName: {{ required "ingress.className is required" .Values.ingress.className | quote }}
  tls:
    - hosts: [{{ .Values.publicHost | quote }}]
      secretName: {{ required "ingress.tlsSecret is required" .Values.ingress.tlsSecret | quote }}
  rules:
    - host: {{ .Values.publicHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: proxy, port: {number: 8080}}}
{{- end }}
