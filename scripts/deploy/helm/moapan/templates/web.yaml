apiVersion: apps/v1
kind: Deployment
metadata: {namespace: {{ .Release.Namespace | quote }}, name: web}
spec:
  replicas: {{ .Values.webReplicas }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app: moapan, component: web}}
  template:
    metadata:
      labels: {app: moapan, component: web}
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-schema
          image: {{ include "moapan.image" .Values.images.database }}
          env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: DATABASE_PASSWORD}}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: '0.25', memory: 128Mi}}
          command: [sh, -ec]
          args:
            - |
              n=0
              until [ "$(psql -h db -U moapan -d moapan -Atc "SELECT count(*) FROM flyway_schema_history WHERE version='{{ .Values.migrationVersion }}' AND success" 2>/dev/null)" = 1 ]; do
                n=$((n+1)); [ "$n" -lt 200 ] || exit 1; sleep 3
              done
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: web
          image: {{ include "moapan.image" .Values.images.app }}
          envFrom: [{configMapRef: {name: moapan-settings}}]
          env:
            - {name: MOAPAN_ROLE, value: web}
{{ include "moapan.secretEnv" . | indent 12 }}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '1.5', memory: 768Mi}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /internal/live, port: 8080, httpHeaders: [{name: Host, value: {{ .Values.publicHost | quote }}}]}, periodSeconds: 10}
          startupProbe: {httpGet: {path: /internal/live, port: 8080, httpHeaders: [{name: Host, value: {{ .Values.publicHost | quote }}}]}, periodSeconds: 5, failureThreshold: 24}
          livenessProbe: {httpGet: {path: /internal/live, port: 8080, httpHeaders: [{name: Host, value: {{ .Values.publicHost | quote }}}]}, periodSeconds: 20, failureThreshold: 3}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
