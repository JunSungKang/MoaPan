apiVersion: batch/v1
kind: Job
metadata: {namespace: {{ .Release.Namespace | quote }}, name: 'moapan-migrate-{{ .Release.Revision }}'}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata: {labels: {app: moapan, component: migrate}}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-db
          image: {{ include "moapan.image" .Values.images.database }}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: '0.25', memory: 128Mi}}
          command: [sh, -ec, 'until pg_isready -h db -U moapan_migrate -d moapan; do sleep 3; done']
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: migrate
          image: {{ include "moapan.image" .Values.images.app }}
          envFrom: [{configMapRef: {name: moapan-settings}}]
          env:
            - {name: MOAPAN_ROLE, value: migrate}
            - {name: DATABASE_USER, value: moapan_migrate}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret | quote }}, key: DATABASE_ADMIN_PASSWORD}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '1', memory: 768Mi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 128Mi}}]
