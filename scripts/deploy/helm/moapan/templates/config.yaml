apiVersion: v1
kind: ConfigMap
metadata: {namespace: {{ .Release.Namespace | quote }}, name: moapan-settings}
data:
  DATABASE_URL: jdbc:postgresql://db:5432/moapan
  DATABASE_USER: moapan
  PUBLIC_BASE_URL: {{ printf "https://%s" (required "publicHost is required" .Values.publicHost) | quote }}
  COOKIE_SECURE: "true"
  SOURCE_MIN_INTERVAL_SECONDS: "300"
---
apiVersion: v1
kind: ConfigMap
metadata: {namespace: {{ .Release.Namespace | quote }}, name: moapan-caddy}
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }
    :8080 {
      # HTML declares its actual language; the server does not negotiate translations.
      header -Content-Language
      @public_documents path / /index.html /about.html /privacy.html /terms.html /robots.txt /sitemap.xml /assets/*
      encode @public_documents zstd gzip
      @internal path /internal/* /actuator/*
      respond @internal 404
      header Strict-Transport-Security "max-age=31536000; includeSubDomains"
      request_body {
        max_size 16KB
      }
      reverse_proxy web:8080 {
        header_up -X-Forwarded-For
        header_up -X-Forwarded-Host
        header_up -X-Forwarded-Proto
      }
    }
