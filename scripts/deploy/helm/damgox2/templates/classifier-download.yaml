apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: 'classifier-download-{{ .Release.Revision }}'
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: damgox2, component: classifier-download, model-volume: classifier}}
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: damgox2, model-volume: classifier}}
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: download
          image: {{ include "damgox2.image" .Values.images.classifier }}
          command: [/opt/classification/model-init.sh]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '0.5', memory: 192Mi}}
          volumeMounts: [{name: model, mountPath: /models}, {name: tmp, mountPath: /tmp}]
      volumes:
        - {name: model, persistentVolumeClaim: {claimName: damgox2-classification-model}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
