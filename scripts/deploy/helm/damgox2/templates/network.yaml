# Requires a NetworkPolicy-capable CNI. Model runtime pods cannot initiate any connections.
{{- range $component, $port := dict "db" 5432 "web" 8080 "translator" 9931 "classifier" 9931 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: {{ $component }}-ingress}
spec:
  podSelector: {matchLabels: {app: damgox2, component: {{ $component }}}}
  policyTypes: [Ingress]
  ingress:
    - from:
      {{- if eq $component "db" }}
        - podSelector: {matchExpressions: [{key: component, operator: In, values: [web, worker, migrate]}], matchLabels: {app: damgox2}}
      {{- else if eq $component "web" }}
        - podSelector: {matchLabels: {app: damgox2, component: proxy}}
      {{- else }}
        - podSelector: {matchLabels: {app: damgox2, component: worker}}
      {{- end }}
      ports: [{protocol: TCP, port: {{ $port }}}]
{{- end }}

{{- range $component := list "translator" "classifier" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {namespace: {{ $.Release.Namespace | quote }}, name: {{ $component }}-egress-deny}
spec:
  podSelector: {matchLabels: {app: damgox2, component: {{ $component }}}}
  policyTypes: [Egress]
  egress: []
{{- end }}
