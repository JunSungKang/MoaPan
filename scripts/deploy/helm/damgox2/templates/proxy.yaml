apiVersion: apps/v1
kind: Deployment
metadata: {namespace: {{ .Release.Namespace | quote }}, name: proxy}
spec:
  replicas: 1
  selector: {matchLabels: {app: damgox2, component: proxy}}
  template:
    metadata:
      labels: {app: damgox2, component: proxy}
      annotations: {checksum/config: '{{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}'}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: proxy
          image: {{ include "damgox2.image" .Values.images.proxy }}
          ports: [{containerPort: 8080}]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: '0.5', memory: 128Mi}}
          readinessProbe: {tcpSocket: {port: 8080}}
          livenessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 15}
          volumeMounts: [{name: config, mountPath: /etc/caddy, readOnly: true}, {name: tmp, mountPath: /tmp}, {name: data, mountPath: /data}, {name: cache, mountPath: /config}]
      volumes:
        - {name: config, configMap: {name: damgox2-caddy}}
        - {name: tmp, emptyDir: {}}
        - {name: data, emptyDir: {}}
        - {name: cache, emptyDir: {}}
