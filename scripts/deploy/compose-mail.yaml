# Opt-in self-hosted MailBox SMTP overlay. No host SMTP/IMAP/Webmail port is published.
x-mail-environment: &mail-environment
  MOAPAN_MAIL_ENABLED: 'true'
  MOAPAN_MAIL_HOST: mailbox-smtp
  MOAPAN_MAIL_PORT: '25'
  MOAPAN_MAIL_FROM: ${MAIL_FROM:?Set verified MAIL_FROM}
  MOAPAN_MAIL_TLS: STARTTLS
  MOAPAN_MAIL_CA_FILE: /run/secrets/smtp-ca
  MOAPAN_MAIL_DATA_KEY_FILE: /run/secrets/email-data-key
x-mail-secrets: &mail-secrets
  - {source: email-data-key, target: email-data-key}
  - {source: smtp-ca, target: smtp-ca}
services:
  web:
    environment: *mail-environment
    secrets: *mail-secrets
  worker:
    environment: *mail-environment
    secrets: *mail-secrets
    networks: [backend, smtp-submission]
  mailbox-smtp:
    image: damgox2-mailbox-smtp:1.0.0
    build: {context: ./.local/mail/source}
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:?Set MAIL_HOSTNAME}
      MAIL_DOMAINS: example.test
      MYNETWORKS: '127.0.0.0/8 172.31.252.0/28'
    secrets:
      - {source: smtp-cert, target: smtp-cert}
      - {source: smtp-key, target: smtp-key}
    read_only: true
    tmpfs: ['/etc/postfix:size=8m,mode=0755', '/var/log:size=8m,mode=0755', '/var/lib/postfix:size=8m,mode=0755', '/run:size=4m,mode=0755', '/tmp:size=8m,mode=1777', '/var/spool/postfix:size=64m,mode=0755', '/var/mail/vhosts:size=16m,mode=0755', '/accounts:size=1m,mode=0750', '/var/spool/postfix/run/secrets:size=1m,mode=0750']
    networks: [smtp-submission, smtp-egress]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_BIND_SERVICE, KILL, SYS_CHROOT]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL','postfix status >/dev/null 2>&1']
      interval: 10s
      timeout: 3s
      retries: 6
networks:
  smtp-submission:
    internal: true
    ipam: {config: [{subnet: 172.31.252.0/28}]}
  smtp-egress:
secrets:
  email-data-key: {file: ./.local/mail/data.key}
  smtp-ca: {file: ./.local/mail/tls/ca.crt}
  smtp-cert: {file: ./.local/mail/tls/server.crt}
  smtp-key: {file: ./.local/mail/tls/server.key}
