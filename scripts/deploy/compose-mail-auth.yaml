# Additional client-side SMTP AUTH; compose after compose-mail-external.yaml.
x-smtp-auth: &smtp-auth
  MOAPAN_MAIL_USERNAME: ${MAIL_SMTP_USERNAME:?Set SMTP submission username}
  MOAPAN_MAIL_PASSWORD_FILE: /run/secrets/external-smtp-password
services:
  web:
    environment: *smtp-auth
    secrets:
      - {source: external-smtp-password, target: external-smtp-password}
  worker:
    environment: *smtp-auth
    secrets:
      - {source: external-smtp-password, target: external-smtp-password}
secrets:
  external-smtp-password:
    file: ${MAIL_SMTP_PASSWORD_FILE:?Set private SMTP password file}
