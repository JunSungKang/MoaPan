spring.application.name=moapan
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
spring.flyway.clean-disabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/
server.tomcat.accesslog.enabled=false
server.tomcat.max-http-form-post-size=16384
server.max-http-request-header-size=16KB
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.log-request-details=false
spring.sql.init.mode=never
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.web=INFO
moapan.secret=${MOAPAN_SECRET}
moapan.public-base-url=${PUBLIC_BASE_URL}

spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-init-sql=SET statement_timeout TO '10s'

moapan.source-min-interval=${SOURCE_MIN_INTERVAL_SECONDS:300}
