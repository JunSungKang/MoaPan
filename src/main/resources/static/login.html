<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인</title><link rel="stylesheet" href="/assets/css/newspaper.css"><link rel="stylesheet" href="/assets/css/auth.css"><script type="module" src="/assets/js/auth.js"></script></head>
<body class="auth-page"><a class="skip" href="#main">본문으로 이동</a><header class="auth-brand"><a href="/index.html" data-brand>모아판</a></header>
<main id="main" class="auth-main"><h1>로그인</h1>
<form data-mode="login" data-terms-version="2026-10-28.2">
<label for="username">아이디</label><input id="username" name="username" required minlength="4" maxlength="32" pattern="[A-Za-z0-9_]{4,32}" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-error">
<small id="username-error" class="field-error"></small>
<label for="password">비밀번호</label><input id="password" name="password" type="password" required minlength="15" maxlength="256" autocomplete="current-password" aria-describedby="password-error">
<small id="password-error" class="field-error"></small>

<div id="login-limit" class="login-limit" hidden><p>잠시 후 다시 로그인할 수 있습니다.</p><span>남은 시간 </span><strong id="login-countdown" role="timer" aria-live="off"></strong></div>
<button type="submit">로그인</button><p role="status" aria-live="polite"></p>
</form><p class="auth-switch">아직 계정이 없나요? <a href="/signup.html">회원가입</a></p></main>
<footer class="auth-footer"><a href="/terms.html">이용약관</a><a href="/privacy.html">개인정보 처리방침</a></footer></body></html>
