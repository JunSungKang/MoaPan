<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인</title><link rel="stylesheet" href="/assets/css/newspaper.css"><script type="module" src="/assets/js/auth.js"></script></head><body><a class="skip" href="#main">본문으로 이동</a><header class="masthead"><div class="topline"><span data-brand-en>MOAPAN</span><span>여러 출처, 나의 지면</span><span>개인화 뉴스 V1</span></div><h1><a href="/index.html" data-brand>모아판</a></h1><p class="motto">세상의 소식을 모아, 나에게 필요한 한 판</p><div class="meta"><time id="today"></time><div id="account-menu"><a href="/login.html">로그인</a><a href="/signup.html">회원가입</a></div></div></header><main id="main" class="narrow"><h2>다시 지면을 펼치다</h2><p>이름·이메일·전화번호를 받지 않으며, 관심사 설정은 현재 브라우저 안에 저장합니다.</p><form data-mode="login"><label>아이디<input name="username" required minlength="4" maxlength="32" pattern="[A-Za-z0-9_]{4,32}" autocomplete="username" autocapitalize="none" spellcheck="false"></label><p class="muted">영문·숫자·밑줄 4~32자. 영문 대문자는 소문자로 처리합니다.</p><label>비밀번호<input name="password" type="password" required minlength="15" maxlength="256" autocomplete="current-password"></label><p class="muted">15~128자. 공백과 유니코드를 사용할 수 있습니다.</p><button>로그인</button></form><p role="status" aria-live="polite"></p><p><a href="/signup.html">새 계정 만들기</a></p></main><footer><a href="/about.html">소개·출처</a><a href="/privacy.html">개인정보 안내</a><a href="/terms.html">이용약관 초안</a><span>원문 이동 후의 정보 처리는 원문 사이트 정책에 따릅니다.</span></footer></body></html>
