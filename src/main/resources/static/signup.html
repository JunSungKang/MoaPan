<!doctype html>
<html lang="ko" data-page-title="회원가입"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | 담고담고 DamGoX2</title><link rel="stylesheet" href="/assets/css/newspaper.css"><link rel="stylesheet" href="/assets/css/auth.css"><script type="module" src="/assets/js/identity/auth.js"></script><meta name="description" content="아이디·비밀번호와 수신 이메일 인증으로 담고담고 계정을 만듭니다."><meta name="robots" content="noindex, follow"><meta name="application-name" content="담고담고 DamGoX2"><meta property="og:type" content="website"><meta property="og:site_name" content="담고담고 DamGoX2"><meta property="og:title" content="회원가입 | 담고담고 DamGoX2"><meta property="og:description" content="아이디·비밀번호와 수신 이메일 인증으로 담고담고 계정을 만듭니다."><meta property="og:locale" content="ko_KR"><link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg"></head>
<body class="auth-page"><a class="skip" href="#main">본문으로 이동</a><header class="auth-brand"><a href="/index.html" data-brand-en>DamGoX2</a></header>
<main id="main" class="auth-main"><h1>회원가입</h1>
<form method="post" data-mode="signup" data-terms-version="terms-1">
<label for="username">아이디</label><input id="username" name="username" required minlength="1" maxlength="128" pattern="[A-Za-z0-9_]{1,128}" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-error username-hint">
<small id="username-hint">영문·숫자·밑줄 1~128자</small><small id="username-error" class="field-error"></small>
<label for="password">비밀번호</label><input id="password" name="password" type="password" required minlength="6" maxlength="256" autocomplete="new-password" aria-describedby="password-error password-hint">
<small id="password-hint">6~128자 · 공백 사용 가능</small><small id="password-error" class="field-error"></small>
<label for="email">수신 이메일</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email" aria-describedby="email-purpose"><p id="email-purpose" class="email-purpose">이메일은 가입 인증, 비밀번호 재설정, 결제·구독 관련 안내에만 사용하며 마케팅·광고 등 다른 목적으로 사용하지 않습니다.</p><label class="remember-option"><input name="emailPolicyAccepted" type="checkbox" required>이메일 이용 안내를 확인했습니다 (필수)</label><button type="button" data-request-code>인증번호 받기</button><p data-email-status role="status" aria-live="polite"></p><label for="code">인증번호</label><input id="code" name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
<div class="agreement"><p>이용약관 동의 (필수)</p><button type="button" class="terms-open" data-open-terms aria-haspopup="dialog" aria-controls="terms-dialog" aria-describedby="terms-consent terms-error">약관 전문 읽기</button><small id="terms-consent" data-terms-consent aria-live="polite">약관을 읽고 동의해 주세요.</small><small id="terms-error" class="field-error"></small></div>
<button type="submit">가입하기</button><p data-auth-status role="status" aria-live="polite"></p>
</form><p class="auth-switch">이미 계정이 있나요? <a href="/login.html">로그인</a></p></main>
<dialog id="terms-dialog" class="terms-dialog" aria-labelledby="terms-dialog-title" aria-describedby="terms-dialog-hint"><header class="terms-dialog-header"><h2 id="terms-dialog-title">이용약관</h2><button type="button" class="terms-dialog-close" data-terms-close aria-label="약관 닫기">×</button></header><div class="terms-dialog-content" data-terms-content tabindex="0" role="region" aria-label="약관 본문"></div><div class="terms-dialog-footer"><p id="terms-dialog-hint" data-terms-hint aria-live="polite">끝까지 내려 읽으면 동의할 수 있습니다.</p><div class="terms-dialog-actions"><button type="button" data-terms-decline>동의하지 않음</button><button type="button" data-terms-agree disabled>동의</button></div></div></dialog>
<footer class="auth-footer"><a href="/terms.html">이용약관</a><a href="/privacy.html">개인정보 처리방침</a></footer></body></html>
